# nthanh.de – reine statische Seite, kein Build-Schritt (gebaut wird lokal mit veroeffentlichen.py)
[build]
  publish = "."

# www und netlify-Adresse auf die Hauptdomain
[[redirects]]
  from = "https://www.nthanh.de/*"
  to = "https://nthanh.de/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
